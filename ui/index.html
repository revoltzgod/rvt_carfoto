<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>rvt_carfoto</title>
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<script>
const PADDING = 0.04;
const resource = typeof GetParentResourceName === "function" ? GetParentResourceName() : "rvt_carfoto";

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function keyImage(dataUri, key, outputWidth) {
  const img = await loadImage(dataUri);
  const w = img.naturalWidth, h = img.naturalHeight;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const frame = ctx.getImageData(0, 0, w, h);
  const px = frame.data;
  const magentaKey = key[0] > 200 && key[2] > 200 && key[1] < 60;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let i = 0, p = 0; i < px.length; i += 4, p++) {
    const r = px[i], g = px[i + 1], b = px[i + 2];
    const keyness = magentaKey ? Math.min(r, b) - g : g - Math.max(r, b);
    const bright = Math.max(r, g, b);
    if (keyness > 70 && bright > 40) { px[i + 3] = 0; continue; }
    if (keyness > 25) {
      const a = 1 - (keyness - 25) / 45;
      px[i + 3] = Math.round(255 * Math.max(0, Math.min(1, a)));
      if (magentaKey) {
        const m = Math.min(r, b);
        px[i] = Math.min(r, g + (r - m));
        px[i + 2] = Math.min(b, g + (b - m));
      }
    }
    if (px[i + 3] > 24) {
      const x = p % w, y = (p / w) | 0;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) throw new Error("nenhum carro encontrado na imagem.");
  ctx.putImageData(frame, 0, 0);
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const pad = Math.round(Math.max(bw, bh) * PADDING);
  const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
  const sw = Math.min(w - sx, bw + pad * 2), sh = Math.min(h - sy, bh + pad * 2);
  const scale = Math.min(1, outputWidth / sw);
  const out = document.createElement("canvas");
  out.width = Math.round(sw * scale); out.height = Math.round(sh * scale);
  const octx = out.getContext("2d");
  octx.imageSmoothingQuality = "high";
  octx.drawImage(canvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

function reply(payload) {
  fetch(`https://${resource}/keyed`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).catch(() => {});
}

window.addEventListener("message", async (event) => {
  const d = event.data || {};
  if (d.action !== "key") return;
  try {
    reply({ spawn: d.spawn, png: await keyImage(d.image, d.key || [255, 0, 255], d.width || 1600) });
  } catch (e) {
    reply({ spawn: d.spawn, error: e && e.message ? e.message : "falha ao recortar." });
  }
});
</script>
</body>
</html>
